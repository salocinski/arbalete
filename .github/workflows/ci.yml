# Intégration continue d'Arbalète (ARB-8) : sur Windows, à chaque push sur main et à chaque pull request, un job
# vérifie typecheck, tests unitaires et build (phase 1), un autre lance le smoke test Playwright/Electron (phase 2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : aucune étape n'écrit dans le dépôt ni ne publie.
permissions:
  contents: read

# Une exécution plus récente de la même PR annule la précédente ; sur main, chaque push va au bout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: arbalete-browser

jobs:
  verifier:
    name: Typecheck, tests unitaires, build
    runs-on: windows-latest
    timeout-minutes: 15
    # Binaire d'Electron téléchargé une fois par version (cache) : un 502 de GitHub ne casse plus un job qui a déjà le zip.
    # La clé porte la version d'Electron de package.json (src/ci.test.ts la compare) : à changer avec elle.
    env:
      CLE_CACHE_ELECTRON: electron-windows-45.2.3
    steps:
      # Actions épinglées par empreinte de commit (version en commentaire) ; Dependabot les met à jour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 : la majeure embarquée par Electron 45 (voir CLAUDE.md, Conventions).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: arbalete-browser/package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\electron-cache
          key: ${{ env.CLE_CACHE_ELECTRON }}
      # Depuis Electron 42, npm ci ne télécharge plus le binaire : les tests unitaires tournent sous le Node d'Electron.
      - run: npx install-electron
        env:
          # runner.temp n'existe pas dans l'env d'un job, seulement dans celui d'une étape.
          electron_config_cache: ${{ runner.temp }}\electron-cache
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  # Phase 2 : le smoke test lance Arbalète pour de bon (fenêtres Electron pilotées par Playwright) sur la session
  # graphique du poste Windows. Un job à part : ses échecs ne masquent pas ceux du typecheck et des tests unitaires.
  # Aucun nouvel essai automatique : un test instable doit se voir et se corriger, pas se rejouer jusqu'à passer.
  smoke:
    name: Smoke test (Electron)
    runs-on: windows-latest
    timeout-minutes: 20
    # Binaire d'Electron téléchargé une fois par version (cache) : un 502 de GitHub ne casse plus un job qui a déjà le zip.
    # La clé porte la version d'Electron de package.json (src/ci.test.ts la compare) : à changer avec elle.
    env:
      CLE_CACHE_ELECTRON: electron-windows-45.2.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: arbalete-browser/package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\electron-cache
          key: ${{ env.CLE_CACHE_ELECTRON }}
      - run: npx install-electron
        env:
          # runner.temp n'existe pas dans l'env d'un job, seulement dans celui d'une étape.
          electron_config_cache: ${{ runner.temp }}\electron-cache
      # test:smoke compile puis lance Playwright ; l'app des tests démarre sur une page locale, sans réseau.
      - run: npm run test:smoke
      # Contexte d'erreur des tests (test-results/), gardé 7 jours, seulement quand le smoke échoue ; un dossier vide
      # laisse un avertissement plutôt que de passer sous silence.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-test-results
          path: arbalete-browser/test-results/
          retention-days: 7
          if-no-files-found: warn
